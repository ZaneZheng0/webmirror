tasks:
  - id: BUG-009
    phase: regression_hardening
    status: done
    title: Reject invalid fallback assets and eliminate public-config secret false positives
    objective: Audit the latest real user one-click outputs, then fix generic cases where SPA fallback HTML is accepted as a non-document asset or public static configuration is quarantined as a credential, without weakening privacy controls or adding source-domain branches.
    scope:
      - apps/extension
      - apps/helper
      - packages/capture
      - packages/mirror
      - packages/validation
      - fixtures
      - scripts
      - tests
      - docs/ai
    acceptance:
      - A response whose body and declared MIME are incompatible with a required script, style, JSON, WASM, model, binary, image, font, audio, or video resource is not committed as a successful mirror asset.
      - Generic fallback detection can retry or retain a valid captured alternative without replacing required resources with an HTML application shell.
      - Public storefront configuration and public client identifiers do not quarantine the entry document or ordinary static JavaScript, while private keys, authorization credentials, passwords, JWTs, and provider secrets remain blocking.
      - The manual one-click root flows represented by the latest Active Theory, KodeKlubs, MANA yerba mate, and Don't Board Me artifacts are covered by focused regressions or rerun evidence.
      - Scripted regression and manual one-click validation use equivalent clean-browser and entry-state assumptions, or report the remaining difference explicitly.
      - No source-domain branch is added and all existing serial real-site regressions remain green.
    verify:
      - focused downloader, engine, secret-scan, and validation tests
      - pnpm typecheck
      - pnpm lint
      - relevant Playwright end-to-end tests
      - pnpm verify
      - pnpm test:e2e
      - serial installed-extension real-site regressions
      - pnpm package:release
    evidence:
      - 'Latest manual Active Theory root output contains 131 non-document URLs saved with `text/html` bodies and fails validation with local HTTP failures plus blocking runtime errors.'
      - 'Latest manual KodeKlubs root output contains 150 non-document URLs saved with `text/html` bodies and fails with blocked runtime dependencies.'
      - 'Latest MANA yerba mate output quarantines 66 public HTML/JavaScript resources as `structured_credential`, including the entry document, and never reaches validation.'
      - "Latest Don't Board Me output is a clean partial baseline with zero local failures, runtime errors, or replay remote requests."
      - 'Generic body-integrity checks now reject MIME/body mismatches for executable, structured, binary, image, font, audio, video, model, and WASM resources; valid captured alternatives can still be retained.'
      - 'Public storefront configuration and public client identifiers no longer trigger credential quarantine, while private keys, authorization credentials, passwords, JWTs, and provider secrets remain blocking.'
      - 'Interactive captures retain a 20-second minimum discovery window and require both a refreshed root Document request and a post-reload page-ready event before idle completion; the stale-load regression is covered in `apps/extension/src/capture-controller.test.ts`.'
      - 'Equal-content timestamped runtime aliases merge only when every candidate has the same SHA-256; ambiguous or different content remains unmapped.'
      - 'Deep activity pages traverse only the active route subtree, and source navigation retries only bounded transient Chromium failures.'
      - 'Implicit same-origin `/favicon.ico` requests initiated by the browser are filtered without suppressing explicitly linked or parameterized icons.'
      - 'Native Host command probes isolate `NO_COLOR`/`FORCE_COLOR` so warnings cannot contaminate machine-readable version checks; `scripts/windows/common.test.mjs` and installed-host E2E cover the behavior.'
      - 'Installed Helper `0.0.60` passed Shopify at `.codex-runtime/real-site-regressions/www-shopify-com-1786869703983/result.json`: `partial / 99`, 884/895 resources, all eight scroll actions passed, and zero local failures, remote requests, blocking errors, or action failures.'
      - 'Installed Helper `0.0.60` passed MakeMePulse at `.codex-runtime/real-site-regressions/2019-makemepulse-com-1786871456388/result.json`: `partial / 99`, 211/212 resources, all five interactions passed, and zero local failures, remote requests, blocking errors, or action failures.'
      - 'Installed Helper `0.0.60` passed Because Recollection at `.codex-runtime/real-site-regressions/www-because-recollection-com-1786871696186/result.json`: `partial / 99`, 586/631 resources, reached `/laurent-garnier`, and recorded zero local failures, remote requests, blocking errors, or action failures.'
      - 'Installed Helper `0.0.60` passed Active Theory Work at `.codex-runtime/real-site-regressions/activetheory-net-1786872287610/result.json`: `partial / 99`, 826/982 resources, reached `/work/racer`, and recorded zero local failures, remote requests, blocking errors, or action failures.'
      - 'KodeClubs and MANA controls passed at `.codex-runtime/real-site-regressions/www-kodeclubs-com-1786864237923/result.json` and `.codex-runtime/real-site-regressions/en-manayerbamate-com-1786860070403/result.json` with zero local failures, remote requests, blocking errors, or action failures.'
      - '`pnpm verify` passed 493 tests across 33 files; `pnpm test:e2e` passed all 11 scenarios; `pnpm package:release` completed for `0.0.60`.'
      - 'The packaged and installed Helper SHA-256 values match `8d9965216819c8b087a1d2d9fe42636b668f6030f685c35649ac831c66a5eff7`; Chrome and Edge Registry32/Registry64 protocol-2 handshakes return version `0.0.60`.'
      - 'Release SHA-256 values: extension ZIP `6a66b510e4873d8f8911be402922ce620cb19fa91e82b677da9ac686d5577c24`, Native Host ZIP `58a5549fef022cf9d330f6cad7ae6aba4d67f51b9f1d8a88527ea2f57b415185`, SPDX SBOM `d792ddf158c7eabb6d5f23af926f20c8aa2e3b9fba9d6ea4cbfe88d632473ee9`.'
    human_gate: false
  - id: BUG-008
    phase: regression_hardening
    status: done
    title: Verify and harden generic offline replay for new interactive static sites
    objective: Run the installed one-click capture and offline replay flow for KodeKlubs and Active Theory Work, then fix any reusable capture, discovery, localization, or replay defect exposed by either site without source-domain branches.
    scope:
      - apps/extension
      - apps/helper
      - packages/capture
      - packages/mirror
      - packages/validation
      - fixtures
      - scripts
      - tests
      - docs/ai
    acceptance:
      - https://www.kodeclubs.com/ reaches its initial interactive experience offline with no unexpected remote requests, local HTTP failures, blocking runtime errors, or action failures.
      - https://activetheory.net/work reaches its work listing and representative later work state offline with no unexpected remote requests, local HTTP failures, blocking runtime errors, or action failures.
      - Any code change is based on a general resource-capture, dependency-discovery, URL-localization, or replay invariant and contains no source-domain branch.
      - A minimal regression fixture or focused automated test covers every newly fixed failure class.
      - Existing serial real-site regressions and repository quality gates remain green.
    verify:
      - installed extension and Native Host regressions for KodeKlubs and Active Theory Work
      - source-versus-loopback browser diagnostics and interaction screenshots
      - focused fixture and unit regressions for every discovered failure class
      - pnpm typecheck
      - pnpm lint
      - relevant Playwright end-to-end tests
      - pnpm verify
      - pnpm test:e2e
      - pnpm package:release
    evidence:
      - 'Generic validation and real-site replay handling now recognizes only known browser-generated media playback cancellations caused by pause, replacement load, or media removal; candidates become warnings only after every local resource, remote-request, screenshot, Canvas, diagnostic, and configured-action check passes.'
      - 'Arbitrary runtime errors remain blocking. The earlier Active Theory `_this.initSync is not a function` event was not whitelisted and did not reproduce on the source page, four controlled stressed replays, or two later complete captures.'
      - '`scripts/real-site-plan.test.mjs` and `packages/validation/src/runner.test.ts` cover accepted media cancellation signatures, rejection of unrelated failures, strict downgrade preconditions, and blocking behavior when another replay check fails.'
      - 'BUG-008 focused tests passed 48/48.'
      - 'Installed Helper `0.0.40` passed KodeKlubs at `.codex-runtime/real-site-regressions/www-kodeclubs-com-1784771292019/result.json`: `partial / 99`, 366/380 resources, both planned actions passed, and zero local failures, remote requests, blocking errors, or action failures; one browser media cancellation remains visible as a warning.'
      - 'Installed Helper `0.0.40` passed Active Theory Work at `.codex-runtime/real-site-regressions/activetheory-net-1784771624946/result.json`: `partial / 99`, 757/873 resources, reached `/work/frontier-within`, and recorded zero local failures, remote requests, page errors, blocking errors, or action failures.'
      - '`pnpm verify` passed 372 tests across 30 files; `pnpm test:e2e` passed all 11 scenarios; `pnpm package:release` completed.'
      - 'The packaged and installed Helper SHA-256 values match `5914ea20299a1450ccd33fb161807901f8c8c37bc1188e87f8786adc38947848`; Chrome and Edge Registry32/Registry64 protocol-2 handshakes return version `0.0.40`.'
      - 'Release SHA-256 values: extension ZIP `9aea6ad1515fb0a94bb1780eca6ab65dae93d206f8e47cdaa0f9fa5ede9c77a6`, Native Host ZIP `cc576387069a76bbf2f2f3fee55fb3bd7c81e02cee4b3ffa90991604080f3bd7`, SPDX SBOM `81c3de324329c7d689c3919c1e94a1212be610204ef1750061722df96c92ce41`.'
