  - id: BUG-007
    phase: regression_hardening
    status: done
    title: Localize runtime-composed WebGL resource URLs without site-specific rules
    objective: Fix the generic capture and replay gap that leaves newly mirrored WebGL pages requesting source assets after the entry runtime has loaded.
    scope:
      - apps/extension
      - packages/capture
      - packages/mirror
      - packages/validation
      - fixtures
      - scripts
      - docs/ai
    acceptance:
      - Corn Revolution progresses beyond its loading screen through the installed extension one-click flow.
      - Required runtime-composed image, binary, JSON, model, shader, and texture URLs resolve locally with no unexpected remote requests or blocking runtime errors.
      - The implementation is based on captured resource relationships or provable URL construction and does not branch on the source domain.
      - Missing analytics or unavailable nonessential resources do not block the static experience.
      - Existing Because Recollection, MakeMePulse, Landon Norris, and Shopify interaction regressions remain green.
      - A previously unused authorized static/WebGL page passes as a blind regression after the fix.
    verify:
      - user report and mirror artifact diagnostics
      - minimal fixture regression for runtime-composed URLs
      - targeted capture, discovery, localization, and replay tests
      - installed extension Corn Revolution regression
      - existing four-site serial regressions
      - one blind real-site regression
      - pnpm verify
      - pnpm test:e2e
    evidence:
      - 'User mirror `C:\Users\zzp\Documents\WebMirror\cornrevolution.resn.global-20260722T075145Z-df719114-35a` stalled at 41% with 57 unexpected remote requests, 64 blocking console errors, and 1 page error despite 96/98 manifest resources downloading.'
      - 'A second user mirror at `C:\Users\zzp\Documents\WebMirror\cornrevolution.resn.global-20260722T071830Z-48f77e94-ec3` reproduced the same failure class.'
      - 'Generic runtime-composed manifest leaves now remain source-relative when a provable runtime URL expression consumes them; the page-level URL mapper localizes the final URL instead of producing `CDN base + /_external/...`.'
      - 'Validation diagnostic fingerprints are no longer copied into `mirror.json` as online dependencies; the validation report retains the blocked-request evidence separately.'
      - '`packages/mirror/src/rewriter.test.ts` and `apps/helper/src/mirror-service.test.ts` passed 106 targeted tests, including dynamic image renditions and inline CSS custom-property URLs.'
      - 'Installed Helper `0.0.32` passed Corn Revolution at `.codex-runtime/real-site-regressions/cornrevolution-resn-global-1784753659263/result.json`: complete/100, 94/94 resources, nonblank Canvas, zero local failures, remote requests, blocking errors, and action failures.'
      - 'Installed Helper `0.0.32` serial regressions passed Because Recollection, MakeMePulse, Landon Norris, Shopify Editions Winter 2026, and blind Three.js WebGL animation keyframes with zero replay remote requests, blocking errors, and action failures.'
      - '`pnpm verify` passed 355 tests; `pnpm test:e2e` passed 10 scenarios; `pnpm package:release` generated the 0.0.32 artifacts and the installed Helper SHA-256 matches `76d6980506baf574abd58e1a6d3804830c077a85505a6347d4867a4ad9007dbe`.'
    human_gate: false
  - id: BUG-006
    phase: regression_hardening
    status: done
    title: Fix bounded resource-graph truncation and missing runtime modules on large static sites
    objective: Replace first-come resource truncation with a bounded, runtime-critical dependency closure that keeps large authorized static mirrors runnable without source-domain special cases.
    scope:
      - apps/extension
      - apps/helper
      - packages/capture
      - packages/mirror
      - packages/validation
      - fixtures
      - tests
      - scripts
      - docs/ai
    acceptance:
      - Shopify Editions Winter 2026 opens from the installed extension without blocking local script failures.
      - Resource limits preserve entry-runtime scripts, module dependencies, workers, styles, fonts, and directly rendered media before optional navigation pages or redundant responsive variants.
      - Mirrors report an explicit capability boundary when a bounded capture cannot retain the complete reachable resource graph.
      - The fix is generic and does not branch on Shopify or any source domain.
      - Because Recollection, MakeMePulse, and Landon Norris retain their verified later interaction behavior.
    verify:
      - targeted unit and fixture regression tests
      - source-versus-mirror browser diagnostics for Shopify Editions Winter 2026
      - pnpm typecheck
      - pnpm lint
      - relevant Playwright end-to-end tests
      - pnpm verify
      - installed extension and Native Host real-site regression
    evidence:
      - '`packages/mirror/src/engine.test.ts` covers runtime-closure priority, bounded navigation capture, resource and byte capability boundaries, and preservation of runtime assets before optional media.'
      - 'Targeted BUG-006 mirror, discovery, rewrite, and capture regressions passed 114/114 tests.'
      - 'Installed Helper `0.0.23` with Native Messaging protocol 2 passed the Shopify Editions Winter 2026 regression at `.codex-runtime/real-site-regressions/www-shopify-com-1784692400777/result.json`: 1,493 downloaded resources, 7 failed resources, 0 skipped resources, 500,933,583 downloaded bytes, 0 local replay failures, 0 remote requests, 0 blocking errors, and all 8 scroll actions reached `47,583.2 / 48,303px`.'
      - 'The Shopify mirror reported the 1,500-resource capability boundary without falsely reporting the 512 MiB byte boundary; at least 19 reachable resources were omitted after runtime-critical closure selection.'
      - 'The installed Helper `0.0.23` MakeMePulse regression at `.codex-runtime/real-site-regressions/2019-makemepulse-com-1784693805244/result.json` passed entry, Start, drag, and Next with 0 local replay failures and 0 remote requests.'
      - 'The installed Helper `0.0.23` Landon Norris serial regression at `.codex-runtime/real-site-regressions/landonorris-com-1784694371821/result.json` passed menu, On Track, and scroll interactions with 0 local replay failures, 0 remote requests, and 0 blocking errors.'
      - 'The installed Helper `0.0.23` Because Recollection regression at `.codex-runtime/real-site-regressions/www-because-recollection-com-1784693805195/result.json` completed 589/589 resources and passed both later artist-route transitions with 0 local replay failures, 0 remote requests, and 0 blocking errors.'
      - 'A three-process stress run exposed local CDP 3-second command saturation; the supported one-job regression was rerun serially and passed, and `docs/ai/COMMANDS.md` now requires serial real-site execution.'
      - '`pnpm verify` passed formatting, lint, type checks, 304 tests, and all workspace builds.'
      - '`pnpm test:e2e` passed 8/8 scenarios, including the installed Native Host one-click path.'
      - '`pnpm package:release` generated the 0.0.23 extension ZIP, Windows Native Host ZIP, SPDX SBOM, and release manifest; the installed Helper SHA-256 is `932b430d54b661877eb0d3bd417f85bdf5f4738dea83ee065077fb645dafaf79`.'
